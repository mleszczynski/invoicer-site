<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Invoicer quokka">
  <defs><clipPath id="badge"><circle cx="32" cy="32" r="31"/></clipPath></defs>
  <circle cx="32" cy="32" r="31" fill="#0077c5"/>
  <g clip-path="url(#badge)">
    <!-- body -->
    <ellipse cx="32" cy="61" rx="18" ry="16" fill="#7f6957"/>
    <!-- upright oval ears, tilted outward -->
    <ellipse cx="20" cy="15" rx="5" ry="6.4" transform="rotate(-22 20 14.5)" fill="#7f6957"/>
    <ellipse cx="44" cy="15" rx="5" ry="6.4" transform="rotate(22 44 14.5)" fill="#7f6957"/>
    <ellipse cx="20.3" cy="15.3" rx="2.5" ry="3.9" transform="rotate(-22 20.3 15.3)" fill="#4f3f33"/>
    <ellipse cx="43.7" cy="15.3" rx="2.5" ry="3.9" transform="rotate(22 43.7 15.3)" fill="#4f3f33"/>
    <!-- pear-shaped head: narrow crown, chubby cheeks -->
    <ellipse cx="32" cy="25.5" rx="13" ry="12" fill="#7f6957"/>
    <ellipse cx="32" cy="33" rx="15.5" ry="9.5" fill="#7f6957"/>
    <!-- lighter chin and throat fur -->
    <ellipse cx="32" cy="37.5" rx="8.5" ry="5" fill="#bfa58c"/>
    <!-- eyes set wide -->
    <circle cx="24.6" cy="25" r="2.1" fill="#16100c"/>
    <circle cx="39.4" cy="25" r="2.1" fill="#16100c"/>
    <circle cx="25.2" cy="24.4" r=".7" fill="#fff"/>
    <circle cx="40" cy="24.4" r=".7" fill="#fff"/>
    <!-- big dark nose and the quokka grin reaching into the cheeks -->
    <path d="M28.2 29.6q3.8-1.8 7.6 0q-.5 3-3.8 3.4q-3.3-.4-3.8-3.4z" fill="#16100c"/>
    <path d="M32 33v1.6M24.5 33.2q7.5 7.4 15 0" fill="none" stroke="#16100c" stroke-width="1.7" stroke-linecap="round"/>
    <!-- invoice held up in both paws -->
    <rect x="21" y="42" width="22" height="20" rx="2" fill="#fff"/>
    <path d="M25 47.5h14M25 51.5h14M25 55.5h8" stroke="#9cc6e6" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="22" cy="45" rx="3.2" ry="2.7" fill="#5f4d40"/>
    <ellipse cx="42" cy="45" rx="3.2" ry="2.7" fill="#5f4d40"/>
  </g>
</svg>
